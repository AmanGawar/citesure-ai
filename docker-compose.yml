services:
  ui:
    build: .
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["./data:/app/data"]
  api:                       # optional: docker compose --profile api up --build
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data"]
    profiles: ["api"]
